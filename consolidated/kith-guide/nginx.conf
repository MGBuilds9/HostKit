server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    # Videos and posters change rarely: cache hard, load fast on repeat visits.
    location ~* \.(mp4|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML itself, so updates go live immediately.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
